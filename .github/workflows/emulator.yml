name: Emulator test

on:
  workflow_dispatch:
  push:
    branches: [emulator-test]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk

      - name: Start fake Plex server
        run: |
          pip install pillow
          nohup python3 test/server.py 32400 > server.log 2>&1 &
          sleep 2
          curl -s http://127.0.0.1:32400/identity -H "X-Plex-Token: TESTTOKEN"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash test/run.sh

      - name: Report crash
        if: always()
        run: |
          if [ -s shots/crash.txt ]; then
            head -30 shots/crash.txt | while IFS= read -r l; do echo "::error::$l"; done
          else
            echo "::notice::No crash in logcat"
          fi
          ls -la shots

      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd shots && zip -q ../shots.zip * && cd ..
          gh release create "emulator-${{ github.run_number }}" shots.zip --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Emulator screenshots (run ${{ github.run_number }})" --notes "Automated test screenshots"
