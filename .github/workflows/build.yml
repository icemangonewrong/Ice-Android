name: Build Ice for Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # Turn Kotlin/Gradle errors into annotations so they're readable without the full log.
      - name: Show errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not resolve|> " build.log | grep -v "^> Task" | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::$(echo "$line" | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' | cut -c1-400)"
          done

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk Ice.apk
          ls -la Ice.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ice-apk
          path: Ice.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%B > notes.txt
          gh release create "build-${{ github.run_number }}" Ice.apk --title "Ice for Android (build ${{ github.run_number }})" --notes-file notes.txt --latest

      - name: Publish test pre-release
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%B > notes.txt
          gh release create "test-${GITHUB_REF_NAME}-${{ github.run_number }}" Ice.apk --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "TEST: ${GITHUB_REF_NAME} (build ${{ github.run_number }})" --notes-file notes.txt
